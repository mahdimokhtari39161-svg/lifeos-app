plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lifeos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lifeos.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
