<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="LifeOS — one simple space for your everyday life.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>LifeOS — زندگی، ساده‌تر</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="LifeOS home">
        <span class="brand-mark">L</span>
        <span><strong>LifeOS</strong><small>YOUR EVERYDAY HUB</small></span>
      </a>
      <div class="side-label" data-i18n="workspace">فضای کار</div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span data-i18n="home">خانه</span></button>
        <button class="nav-item" data-view="tools"><span class="nav-icon">▦</span><span data-i18n="toolbox">جعبه‌ابزار</span><span class="nav-count">6</span></button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">☑</span><span data-i18n="tasks">کارها</span></button>
        <button class="nav-item" data-view="money"><span class="nav-icon">◈</span><span data-i18n="money">مدیریت مالی</span></button>
        <button class="nav-item" data-view="notes"><span class="nav-icon">▤</span><span data-i18n="notes">یادداشت‌ها</span></button>
        <button class="nav-item" data-view="habits"><span class="nav-icon">✳</span><span data-i18n="habits">عادت‌ها</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="upgrade-mini">
          <span class="sparkle">✦</span>
          <strong data-i18n="unlockPro">قابلیت‌های بیشتر؟</strong>
          <p data-i18n="proDesc">به‌زودی امکانات حرفه‌ای LifeOS</p>
          <button class="text-button" data-action="pro" data-i18n="explorePro">آشنایی با نسخه Pro ↗</button>
        </div>
        <button class="profile-row" data-view="settings">
          <span class="avatar">L</span><span class="profile-copy"><strong>LifeOS User</strong><small data-i18n="localAccount">حساب محلی</small></span><span class="dots">•••</span>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuToggle" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span class="crumb-muted">LifeOS</span><span class="crumb-slash">/</span><strong id="pageTitle" data-i18n="home">خانه</strong></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="جست‌وجوی ابزارها..." data-i18n-placeholder="searchPlaceholder"><kbd>⌘ K</kbd></label>
          <button class="icon-button" id="themeToggle" aria-label="Toggle theme" title="Theme">◐</button>
          <button class="icon-button notification-button" id="notificationBtn" aria-label="Notifications">♧<i></i></button>
          <button class="language-button" id="languageToggle" aria-label="Change language">FA</button>
        </div>
      </header>

      <section class="content" id="appContent" aria-live="polite">
        <div class="loading-state"><span class="loader"></span><span>LifeOS</span></div>
      </section>

      <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation">
        <button class="bottom-item active" data-view="home"><span>⌂</span><small data-i18n="home">خانه</small></button>
        <button class="bottom-item" data-view="tools"><span>▦</span><small data-i18n="tools">ابزارها</small></button>
        <button class="bottom-item" data-view="tasks"><span>☑</span><small data-i18n="tasks">کارها</small></button>
        <button class="bottom-item" data-view="money"><span>◈</span><small data-i18n="money">مالی</small></button>
        <button class="bottom-item" data-view="settings"><span>⚙</span><small data-i18n="settings">تنظیمات</small></button>
      </nav>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle">LifeOS</h2><button class="icon-button" id="modalClose" aria-label="Close">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
