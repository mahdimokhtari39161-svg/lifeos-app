name: Build Stamp Tool Android APK

on:
  push:
    branches: [main]
    paths:
      - 'stamp-tool/**'
      - '.github/workflows/build-stamp-tool-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Qassemi APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Capacitor dependencies
        working-directory: stamp-tool
        run: npm install

      - name: Prepare Capacitor web assets
        working-directory: stamp-tool
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Add Android platform
        working-directory: stamp-tool
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: stamp-tool
        run: npx cap sync android

      - name: Build debug APK
        working-directory: stamp-tool/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qassemi-Stamp-Tool-APK
          path: stamp-tool/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
