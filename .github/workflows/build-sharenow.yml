name: Build ShareNow Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'sharenow-android/**'
      - '.github/workflows/build-sharenow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ShareNow APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore stable ShareNow debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sharenow-debug-signing-key-v1

      - name: Create stable debug signing key on first build
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ShareNow Debug,O=ShareNow,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: sharenow-android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareNow-Android-APK
          path: sharenow-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
